# Runs the test suite on pushes to main and dev and on every pull request. When main or dev
# passes, publishes both to GitHub Pages: main at the site root for students, dev at /dev/ as a
# labelled test copy with its own saved progress.
name: Test and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changes that touch only saved editor data (public/data/, written by the world editor) are
  # checked quickly: formatting, the unit tests that read the changed files
  # (scripts/affected-tests.mjs) and the build, without the browser suite. Anything else, or a
  # change whose base cannot be found, runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      data-only: ${{ steps.diff.outputs.data-only }}
      files: ${{ steps.diff.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          files=""
          if [ "${{ github.event_name }}" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          fi
          # Plain names only: the list is passed on to a later command line.
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^public/data/[A-Za-z0-9._/-]+$'; then
            echo "data-only=true" >> "$GITHUB_OUTPUT"
            echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"
            echo "Only saved editor data changed:"; echo "$files"
          else
            echo "data-only=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check formatting
        run: npm run check
      # From the private IoTProjectApp/iotquest-models (a read-only token in the MODELS_TOKEN
      # secret); without it, as on pull requests from forks, the model tests are skipped.
      - name: Download character models
        run: node scripts/fetch-models.mjs
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      - name: Run tests
        if: needs.changes.outputs.data-only != 'true'
        run: npm test
      - name: Run the tests that read the changed data
        if: needs.changes.outputs.data-only == 'true'
        run: |
          tests=$(node scripts/affected-tests.mjs ${{ needs.changes.outputs.files }})
          echo "$tests"
          if [ -n "$tests" ]; then node --test $tests; fi
      - name: Build
        run: npm run build

  # Drives the real game in headless Chromium (software WebGL) to catch layout, theme and
  # accessibility regressions. Kept out of the deploy gate until it has proven stable on CI.
  # Runs once per world renderer (three.js, the default, and the game's own WebGL renderer it
  # falls back to, ?renderer=webgl), each in two parts that run side by side.
  browser-part:
    name: browser part (${{ matrix.renderer }}, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.data-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgl, three]
        part: [home, world]
        include:
          - part: home
            files: tests/browser/app-home.browser.mjs tests/browser/contrast.browser.mjs tests/browser/teacher.browser.mjs
          - part: world
            files: tests/browser/app-world.browser.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download character models
        run: node scripts/fetch-models.mjs
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      # A failed test gets one more try; one that passes then is flagged as flaky, not failed.
      - name: Run browser tests
        run: node scripts/run-browser-tests.mjs ${{ matrix.files }}
        env:
          RENDERER: ${{ matrix.renderer }}
      # Screenshots and traces of failed tests, also when the job times out; open a trace with
      # `npx playwright show-trace`.
      - name: Upload failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures-${{ matrix.renderer }}-${{ matrix.part }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The single "browser" check that branch protection requires: passes only when every part
  # passed on both renderers, or when the change was saved editor data only.
  browser:
    needs: [changes, browser-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every browser part passed
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.data-only }}" = true ]; then
            echo "Saved editor data only: browser tests not needed."
          else
            test "${{ needs.browser-part.result }}" = success
          fi

  # Pages holds one site, so every deploy rebuilds both branches from their latest commits (each
  # passed these checks before it could be merged). One deploy at a time, so a main deploy and a
  # dev deploy never overwrite each other with an older copy of the other branch.
  deploy:
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Each branch downloads the character models it was tested with, once it has the script.
      - name: Download character models
        run: |
          for branch in main dev; do
            if [ -f $branch/scripts/fetch-models.mjs ]; then node $branch/scripts/fetch-models.mjs; fi
          done
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      - name: Build main and dev
        run: |
          node main/scripts/build.mjs
          node dev/scripts/build.mjs --channel=dev
          mkdir site
          cp -R main/dist/client/. site/
          cp -R dev/dist/client site/dev
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
