# Runs the test suite on pushes to main and dev and on every pull request. When main or dev
# passes, publishes both to GitHub Pages: main at the site root for students, dev at /dev/ as a
# labelled test copy with its own saved progress.
name: Test and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Check formatting
        run: npm run check
      # From the private IoTProjectApp/iotquest-models (a read-only token in the MODELS_TOKEN
      # secret); without it, as on pull requests from forks, the model tests are skipped.
      - name: Download character models
        run: node scripts/fetch-models.mjs
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  # Drives the real game in headless Chromium (software WebGL) to catch layout, theme and
  # accessibility regressions. Kept out of the deploy gate until it has proven stable on CI.
  # Runs once per world renderer: the game's own WebGL renderer and the three.js one that is
  # being brought level with it (?renderer=three).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgl, three]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download character models
        run: node scripts/fetch-models.mjs
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      - name: Run browser tests
        run: npm run test:browser
        env:
          RENDERER: ${{ matrix.renderer }}
      # Screenshots and traces of failed tests, also when the job times out; open a trace with
      # `npx playwright show-trace`.
      - name: Upload failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures-${{ matrix.renderer }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Pages holds one site, so every deploy rebuilds both branches from their latest commits (each
  # passed these checks before it could be merged). One deploy at a time, so a main deploy and a
  # dev deploy never overwrite each other with an older copy of the other branch.
  deploy:
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Each branch downloads the character models it was tested with, once it has the script.
      - name: Download character models
        run: |
          for branch in main dev; do
            if [ -f $branch/scripts/fetch-models.mjs ]; then node $branch/scripts/fetch-models.mjs; fi
          done
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      - name: Build main and dev
        run: |
          node main/scripts/build.mjs
          node dev/scripts/build.mjs --channel=dev
          mkdir site
          cp -R main/dist/client/. site/
          cp -R dev/dist/client site/dev
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
